[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tcg-pokemon-agent"
version = "0.1.0"
# Match the Kaggle submission sandbox, which runs Python 3.11 (observed in a
# validation episode log). Keeping dev on the same minor avoids shipping code
# that only parses on a newer interpreter.
requires-python = ">=3.11,<3.12"
dependencies = [
    "kaggle>=2.2.4",
    "kaggle-environments>=1.32.0",
    # MLX is the local training backend only. Submission inference is PyTorch
    # FP16 and does not vendor or package MLX wheels.
    "mlx>=0.32.0 ; sys_platform == 'darwin'",
    # Lower bounds relaxed to what Python 3.11 supports — the sandbox
    # interpreter. Newer numpy/pandas require 3.12+.
    "numpy>=2.4",
    "pandas>=2.2",
    # Columnar storage for the BC dataset writer (scripts/bc/build_bc_from_zips.py):
    # one zstd-compressed Parquet file per day instead of dozens of .npy shards.
    "pyarrow>=17.0.0",
    "pymupdf>=1.28.0",
    "pyrefly>=0.60.0",
    # Cross-platform host-memory probe used by _ParquetRowGroupCache to
    # evict under system pressure. On darwin/M-series virtual_memory().percent
    # tracks the same metric Activity Monitor's "Memory Pressure" band uses.
    "psutil>=6.0.0",
    "rich>=15.0.0",
    "streamlit>=1.60.0",
    # Live training metrics: bc_train_mlx writes to `runs/<timestamp>/` and
    # the user runs `uv run tensorboard --logdir runs` in a second shell.
    "tensorboard>=2.19.0",
    "torch>=2.13.0",
]

[project.scripts]
tcg-train       = "scripts.bc.bc_train_mlx:main"
tcg-build-bc    = "scripts.bc.build_bc_from_zips:main"
tcg-build-daily = "scripts.bc.build_bc_dataset:main"
tcg-evaluate    = "scripts.evaluate:main"
tcg-tournament  = "scripts.tournament:main"
# Build the submission bundle; add --upload to send it to Kaggle.
tcg-build       = "scripts.submit:main"
tcg-data        = "scripts.data_manager:main"
tcg-dashboard   = "scripts.dashboard:main"
tcg-build-card-stats = "scripts.build_card_stats:main"
tcg-rebuild-db = "scripts.rebuild_db:main"
tcg-daily         = "scripts.daily_pipeline:main"
tcg-train-sequence = "scripts.train_sequence:main"

[tool.hatch.build.targets.wheel]
packages = ["rl", "scripts", "agent", "cg"]
