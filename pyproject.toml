[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tcg-pokemon-agent"
version = "0.1.0"
# Match the Kaggle submission sandbox (gcr.io/kaggle-images/python), which runs
# Python 3.12. Keeping dev on the same minor avoids shipping code that only
# parses on 3.13.
requires-python = ">=3.12,<3.13"
dependencies = [
    "kaggle>=2.2.4",
    "kaggle-environments>=1.32.0",
    # MLX resolves to a platform-specific backend: mlx-metal on macOS, mlx-cpu
    # on Linux. The Kaggle sandbox has neither, so the submission bundle vendors
    # its own wheels — see vendor/wheels/ and scripts/build_submission.py.
    "mlx>=0.32.0 ; sys_platform == 'darwin'",
    "mlx[cpu]>=0.32.0 ; sys_platform == 'linux'",
    "numpy>=2.5.1",
    "pandas>=3.0.3",
    "pymupdf>=1.28.0",
    "pyrefly>=0.60.0",
    "rich>=15.0.0",
    "streamlit>=1.60.0",
    "torch>=2.13.0",
]

[project.scripts]
tcg-train       = "scripts.bc.bc_train_mlx:main"
tcg-build-bc    = "scripts.bc.build_bc_from_zips:main"
tcg-build-daily = "scripts.bc.build_bc_dataset:main"
tcg-evaluate    = "scripts.evaluate:main"
tcg-tournament  = "scripts.tournament:main"
# Build the submission bundle; add --upload to send it to Kaggle.
tcg-build       = "scripts.submit:main"
tcg-data        = "scripts.data_manager:main"
tcg-dashboard   = "scripts.dashboard:main"
tcg-build-card-stats = "scripts.build_card_stats:main"
tcg-daily         = "scripts.daily_pipeline:main"

[tool.hatch.build.targets.wheel]
packages = ["rl", "scripts", "agent", "cg"]
